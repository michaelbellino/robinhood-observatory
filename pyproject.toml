[project]
name = "robinhood-observatory"
version = "0.1.0"
description = "Single-owner, read-only brokerage observation and research"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "fastapi==0.143.3", "uvicorn==0.54.0", "sqlalchemy==2.1.4",
  "psycopg[binary]==3.3.6", "alembic==1.20.0", "httpx[socks]==0.28.1",
  "authlib==1.9.1", "cryptography==50.0.2", "mcp==2.3.0",
  "exchange-calendars==4.13.2", "jsonschema==4.26.0", "itsdangerous==2.2.0"
]
[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "respx==0.23.1", "ruff==0.17.1", "pip-audit==2.10.1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["postgres: requires isolated PostgreSQL database"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
